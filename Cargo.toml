[workspace]
resolver = "3"
members = [".", "./stream_message", "./lumious_headless_helper"]

[workspace.package]
version = "0.1.21"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/waycrate/xdg-desktop-portal-luminous"
keywords = ["wayland"]

[package]
name = "xdg-desktop-portal-luminous"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["wayland"]

[workspace.dependencies]
serde = "1.0.229"
serde_json = "1.0.151"
thiserror = "2.0.20"
stream_message = { path = "./stream_message", version = "0.1.20" }

[dependencies]
zbus = { version = "5.19", default-features = false, features = [
	"tokio",
	"url",
] }
stream_message.workspace = true

tokio = { version = "1.53.1", features = ["full"] }
iced = { features = [
	"tokio",
	"debug",
	"image",
	"advanced",
	"svg",
	"markdown",
], version = "0.14.0" }
iced_runtime = "0.14.0"
iced_futures = "0.14.0"
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true

tracing = "0.1.44"
tracing-subscriber = "0.3.23"
url = { version = "2.5", features = ["serde"] }
serde_repr = "0.1"
image = { version = "=0.24", default-features = false, features = [
	"jpeg",
	"png",
	"pnm",
	"qoi",
] }

bitflags = "2.13.2"
enumflags2 = "0.7.12"
anyhow = "1.0.104"

# pipewire
pipewire = "0.10.1"

libwayshot = { version = "0.9.0", features = ["screencast"] }

rustix = { version = "1.1.4", features = ["fs", "use-libc"] }

# REMOTE
wayland-protocols = { version = "0.32.13", default-features = false, features = [
	"unstable",
	"client",
	"staging",
] }

wayland-protocols-wlr = { version = "0.3.12", default-features = false, features = [
	"client",
] }
wayland-client = { version = "0.31.15" }
os_pipe = { version = "1.2", features = ["io_safety"] }

wayland-protocols-misc = { version = "0.3.12", features = ["client"] }
xkbcommon = "0.9.0"
tempfile = "3.27.0"
thiserror = "2.0.20"
toml = "1.1.6"
csscolorparser = "0.8.4"
notify = "8.2.0"
futures = "0.3.34"
libwaysip = "0.7.0"
reis = { version = "0.7.1", features = ["tokio", "calloop"] }
sctk = { package = "smithay-client-toolkit", version = "0.20.0" }

calloop = "0.14.4"
calloop-wayland-source = "0.4.1"
iced_exwlshell = "0.20.1"
